
# Volumes
volumes:
  morsechatdb:

services:
  #nginx-golang webapp
  morse:
    build: .
    expose:
      - '80'
    ports:
      - 9090:80
    # restart: unless-stopped
    restart: no
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SQLITE_PATH: /app/backend/db/master.sqlite
      SECRET: "${SECRET:?SECRET must be set, copy .env.example to .env}"
      METRICS_ENABLED: "true"
      METRICS_PORT: 8081
    volumes:
      - morsechatdb:/app/backend/db
      - ./backend/filters/:/app/backend/filters
